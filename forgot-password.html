<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somo, Cura - استعادة كلمة المرور</title>
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Font (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fae8ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1e293b;
        }

        .card-box {
            background: #ffffff;
            border-radius: 1.5rem;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.08);
            border: 1px solid #fbcfe8;
            max-width: 450px;
            width: 100%;
            padding: 40px;
        }

        .btn-custom-pink {
            background-color: #db2777;
            border-color: #db2777;
            color: white;
            font-weight: 600;
            border-radius: 50rem;
            padding: 0.6rem 1.5rem;
            transition: all 0.2s;
        }

        .btn-custom-pink:hover {
            background-color: #be185d;
            border-color: #be185d;
            color: white;
        }

        .form-control:focus {
            border-color: #db2777;
            box-shadow: 0 0 0 0.25rem rgba(219, 39, 119, 0.15);
        }

        .text-custom-pink {
            color: #db2777 !important;
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center">
        <div class="card-box">
            <div class="text-center mb-4">
                <div class="icon-box mx-auto mb-3 d-flex align-items-center justify-content-center"
                    style="width: 60px; height: 60px; background-color: #fce7f3; color: #db2777; border-radius: 50px; font-size: 1.5rem;">
                    <i class="bi bi-key-fill"></i>
                </div>
                <h3 class="fw-bold text-dark mb-1">هل نسيت كلمة المرور؟</h3>
                <p class="text-muted small">أدخل بريدك الإلكتروني المسجل وسنرسل لك تعليمات استعادة الحساب.</p>
            </div>

            <form
                onsubmit="event.preventDefault(); alert('تم إرسال رابط استعادة كلمة المرور إلى بريدك الإلكتروني بنجاح!'); window.location.href='llogin.html';">
                <div class="mb-3">
                    <label class="form-label small fw-bold text-secondary">البريد الإلكتروني (Email Address)</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light border-end-0 text-muted"><i
                                class="bi bi-envelope"></i></span>
                        <input type="email" class="form-control border-start-0 bg-light" placeholder="name@example.com"
                            required>
                    </div>
                </div>

                <button type="submit" class="btn btn-custom-pink w-100 py-2 shadow-sm mb-3">إرسال تعليمات
                    الاستعادة</button>

                <div class="text-center">
                    <a href="llogin.html" class="text-decoration-none small text-custom-pink fw-bold">
                        <i class="bi bi-arrow-right me-1"></i> العودة لتسجيل الدخول
                    </a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
