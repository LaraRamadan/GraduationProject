<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somo, Cura - إعدادات الحساب</title>
    <!-- Bootstrap 5 RTL CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Font (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdf2f8;
            color: #1e293b;
            min-height: 100vh;
            padding: 40px 0;
        }

        .card-custom {
            background: #ffffff;
            border-radius: 1rem;
            border: 1px solid #fbcfe8;
            box-shadow: 0 10px 30px rgba(219, 39, 119, 0.04);
            padding: 30px;
        }

        .btn-custom-pink {
            background-color: #db2777;
            border-color: #db2777;
            color: white;
            font-weight: 600;
            border-radius: 50rem;
            padding: 0.5rem 1.5rem;
            transition: all 0.2s;
        }

        .btn-custom-pink:hover {
            background-color: #be185d;
            border-color: #be185d;
            color: white;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">

                <!-- زر العودة -->
                <div class="mb-3">
                    <a href="patient-dashboard.html" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                        <i class="bi bi-arrow-right me-1"></i> العودة لوحة التحكم
                    </a>
                </div>

                <!-- بطاقة الإعدادات -->
                <div class="card-custom">
                    <h3 class="fw-bold text-dark mb-4"><i class="bi bi-gear-fill text-custom-pink me-2"></i>إعدادات
                        الحساب والتفضيلات</h3>

                    <div class="list-group list-group-flush">
                        <!-- خيار وضع كبار السن -->
                        <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div>
                                <h6 class="fw-bold mb-1">وضع كبار السن (Senior Mode)</h6>
                                <p class="text-muted small mb-0">تكبير خطوط العرض والأزرار لتسهيل الاستخدام.</p>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" id="seniorModeSwitch"
                                    style="width: 50px; height: 25px; cursor: pointer;">
                            </div>
                        </div>

                        <!-- خيار إشعارات الأدوية -->
                        <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div>
                                <h6 class="fw-bold mb-1">تنبيهات وإشعارات الأدوية</h6>
                                <p class="text-muted small mb-0">استلام تنبيهات بمواعيد الجرعات الدوائية.</p>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" checked
                                    style="width: 50px; height: 25px; cursor: pointer;">
                            </div>
                        </div>

                        <!-- خيار تقارير الذكاء الاصطناعي -->
                        <div class="list-group-item d-flex justify-content-between align-items-center py-3">
                            <div>
                                <h6 class="fw-bold mb-1">التحديثات التلقائية للتوأم التنبؤي</h6>
                                <p class="text-muted small mb-0">السماح بتحليل الحالة الصحية دورياً.</p>
                            </div>
                            <div class="form-check form-switch">
                                <input class="form-check-input" type="checkbox" checked
                                    style="width: 50px; height: 25px; cursor: pointer;">
                            </div>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <button class="btn btn-custom-pink px-4" onclick="applyAndSaveSeniorMode()">
                            <i class="bi bi-check-circle me-1"></i> حفظ التغييرات
                        </button>

                        <script>
                            function applyAndSaveSeniorMode() {
                                const isChecked = document.getElementById('seniorModeSwitch').checked;

                                // حفظ الحالة
                                localStorage.setItem("seniorMode", isChecked ? "true" : "false");

                                alert('تم حفظ الإعدادات بنجاح!');

                                // الرجوع للداشبورد فوراً
                                window.location.href = "patient-dashboard.html";
                            }
                        </script>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const seniorSwitch = document.getElementById('seniorModeSwitch');
            // جلب الحالة المحفوظة مسبقاً
            if (localStorage.getItem("seniorMode") === "true") {
                seniorSwitch.checked = true;
            } else {
                seniorSwitch.checked = false;
            }
        });

        function saveSettings() {
            const seniorSwitch = document.getElementById('seniorModeSwitch');

            // حفظ الحالة في الذاكرة المحلية
            localStorage.setItem("seniorMode", seniorSwitch.checked);

            alert('تم حفظ إعدادات التفضيلات بنجاح!');

            // الانتقال تلقائياً لوحة التحكم لنرى التأثير فوراً
            window.location.href = "patient-dashboard.html";
        }
    </script>
</body>

</html>
