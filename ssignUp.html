<!DOCTYPE html>
<html lang="en" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somo, Cura - Sign Up</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fae8ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .main-card {
            border: none;
            border-radius: 1.25rem;
            box-shadow: 0 15px 35px rgba(219, 39, 119, 0.12);
            overflow: hidden;
            max-width: 950px;
            width: 100%;
            background-color: #ffffff;
        }

        /* القسم الجانبي الملون */
        .brand-side {
            background: linear-gradient(135deg, #db2777 0%, #f472b6 100%);
            color: white;
            position: relative;
            overflow: hidden;
        }

        .brand-side::before {
            content: '';
            position: absolute;
            width: 240px;
            height: 240px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 50%;
            top: -60px;
            right: -60px;
        }

        .brand-side::after {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            bottom: -50px;
            left: -50px;
        }

        .icon-circle {
            width: 65px;
            height: 65px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            margin: 0 auto 1.2rem;
            backdrop-filter: blur(5px);
        }

        .btn-custom-pink {
            background-color: #db2777;
            border-color: #db2777;
            color: white;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        .btn-custom-pink:hover {
            background-color: #be185d;
            border-color: #be185d;
            color: white;
            transform: translateY(-1px);
        }

        .text-custom-pink {
            color: #db2777 !important;
        }

        .input-group-text {
            background-color: #fdf2f8;
            border-color: #dee2e6;
            color: #db2777;
            font-size: 0.85rem;
        }

        .form-control {
            font-size: 0.83rem;
            border-left: none;
        }

        .form-control:focus {
            border-color: #f472b6;
            box-shadow: none;
        }

        .input-group:focus-within .input-group-text,
        .input-group:focus-within .form-control {
            border-color: #f472b6;
        }

        .input-group:focus-within {
            box-shadow: 0 0 0 0.2rem rgba(219, 39, 119, 0.15);
            border-radius: 0.375rem;
        }

        .custom-dropdown-btn {
            background-color: #ffffff;
            border: 1px solid #dee2e6;
            color: #212529;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.83rem;
        }

        .custom-dropdown-btn:focus,
        .custom-dropdown-btn:hover {
            border-color: #f472b6;
            box-shadow: 0 0 0 0.2rem rgba(219, 39, 119, 0.15);
            background-color: #ffffff;
        }

        .dropdown-item {
            font-size: 0.83rem;
        }

        .dropdown-item:hover,
        .dropdown-item:focus {
            background-color: #fce7f3 !important;
            color: #db2777 !important;
        }

        .form-label {
            font-size: 0.78rem;
            font-weight: 500;
            color: #334155;
            margin-bottom: 2px;
        }

        .mb-custom {
            margin-bottom: 0.75rem !important;
        }

        .login-link {
            color: #db2777;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .login-link:hover {
            color: #be185d;
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="main-card">
        <div class="row g-0">
            <!-- الجزء الأيسر: اللوحة الترحيبية -->
            <div
                class="col-md-4 brand-side d-flex flex-column justify-content-center align-items-center text-center p-4">
                <div class="position-relative z-1">
                    <div class="icon-circle">
                        <i class="bi bi-hospital"></i>
                    </div>
                    <h4 class="fw-bold mb-2">Somo, Cura</h4>
                    <p class="small opacity-75 mb-3">Join our platform for smarter daily healthcare management.</p>
                    <div
                        class="small opacity-90 bg-white text-custom-pink rounded-pill px-3 py-1.5 fw-medium d-inline-block shadow-sm">
                        <i class="bi bi-shield-lock me-1"></i> Your Data is Secure
                    </div>
                </div>
            </div>

            <!-- الجزء الأيمن: فورم إنشاء الحساب -->
            <div class="col-md-8 p-4 p-md-4">
                <div class="mb-3">
                    <h4 class="fw-bold text-dark mb-1" style="font-size: 1.3rem;">Create Account</h4>
                    <p class="text-muted small mb-0">Fill in your information to get started</p>
                </div>

                <form>
                    <!-- Full Name & National ID -->
                    <div class="row mb-custom">
                        <div class="col-md-6 mb-2 mb-md-0">
                            <label for="fullname" class="form-label">Full Name (Quadruple)</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-person"></i></span>
                                <input type="text" class="form-control py-1.5" id="fullname" name="fullname"
                                    placeholder="First Second Third Last" pattern="^\s*\S+(?:\s+\S+){3,}\s*$"
                                    title="Please enter your full quadruple name" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="nationalId" class="form-label">National ID</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-card-text"></i></span>
                                <input type="text" class="form-control py-1.5" id="nationalId" name="nationalId"
                                    placeholder="ID number" required>
                            </div>
                        </div>
                    </div>

                    <!-- Role & Gender -->
                    <div class="row mb-custom">
                        <div class="col-md-6 mb-2 mb-md-0">
                            <label class="form-label">Register As</label>
                            <div class="dropdown w-100">
                                <button class="btn custom-dropdown-btn dropdown-toggle w-100 py-1.5" type="button"
                                    id="roleDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">
                                    <span><i class="bi bi-person-badge text-custom-pink me-2"></i><span
                                            id="selectedRoleText">Patient</span></span>
                                </button>
                                <ul class="dropdown-menu w-100 shadow-sm border-0" aria-labelledby="roleDropdownBtn">
                                    <li><a class="dropdown-item" href="#"
                                            onclick="selectOption('role', 'selectedRoleText', 'Patient', 'patient')">Patient</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"
                                            onclick="selectOption('role', 'selectedRoleText', 'Doctor', 'doctor')">Doctor</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"
                                            onclick="selectOption('role', 'selectedRoleText', 'Secretary', 'secretary')">Secretary</a>
                                    </li>
                                </ul>
                            </div>
                            <input type="hidden" id="role" name="role" value="patient">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Gender</label>
                            <div class="dropdown w-100">
                                <button class="btn custom-dropdown-btn dropdown-toggle w-100 py-1.5" type="button"
                                    id="genderDropdownBtn" data-bs-toggle="dropdown" aria-expanded="false">
                                    <span><i class="bi bi-gender-ambiguous text-custom-pink me-2"></i><span
                                            id="selectedGenderText">Female</span></span>
                                </button>
                                <ul class="dropdown-menu w-100 shadow-sm border-0" aria-labelledby="genderDropdownBtn">
                                    <li><a class="dropdown-item" href="#"
                                            onclick="selectOption('gender', 'selectedGenderText', 'Female', 'female')">Female</a>
                                    </li>
                                    <li><a class="dropdown-item" href="#"
                                            onclick="selectOption('gender', 'selectedGenderText', 'Male', 'male')">Male</a>
                                    </li>
                                </ul>
                            </div>
                            <input type="hidden" id="gender" name="gender" value="female">
                        </div>
                    </div>

                    <!-- Age & Phone Number -->
                    <div class="row mb-custom">
                        <div class="col-md-6 mb-2 mb-md-0">
                            <label for="age" class="form-label">Age</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-calendar-heart"></i></span>
                                <input type="number" class="form-control py-1.5" id="age" name="age"
                                    placeholder="e.g. 22" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="phone" class="form-label">Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                <input type="tel" class="form-control py-1.5" id="phone" name="phone"
                                    placeholder="07XXXXXXXX" required>
                            </div>
                        </div>
                    </div>

                    <!-- Location & Email -->
                    <div class="row mb-custom">
                        <div class="col-md-6 mb-2 mb-md-0">
                            <label for="location" class="form-label">Location / City</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-geo-alt"></i></span>
                                <input type="text" class="form-control py-1.5" id="location" name="location"
                                    placeholder="Amman, Jordan" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control py-1.5" id="email" name="email"
                                    placeholder="name@example.com" required>
                            </div>
                        </div>
                    </div>

                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control py-1.5" id="password" name="password"
                                placeholder="********" required>
                        </div>
                    </div>

                    <!-- Submit Button -->
                    <div class="d-grid gap-2 mb-2">
                        <button type="submit" class="btn btn-custom-pink py-2 fw-bold">Sign Up</button>
                    </div>

                    <!-- Back to Login -->
                    <div class="text-center" style="font-size: 0.8rem;">
                        <span class="text-muted">Already have an account? </span>
                        <a href="llogin.html" class="login-link">Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function selectOption(hiddenInputId, spanTextId, displayName, value) {
            document.getElementById(spanTextId).innerText = displayName;
            document.getElementById(hiddenInputId).value = value;
        }
    </script>
</body>

</html>
