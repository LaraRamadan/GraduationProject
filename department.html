<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفاصيل القسم الطبي - Somo, Cura</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #fae8ff 100%);
            min-height: 100vh;
        }

        .text-custom-pink {
            color: #db2777 !important;
        }

        .bg-custom-pink {
            background-color: #db2777 !important;
        }

        .btn-custom-pink {
            background-color: #db2777;
            color: white;
            border: none;
            transition: all 0.2s;
        }

        .btn-custom-pink:hover {
            background-color: #be185d;
            color: white;
            transform: translateY(-1px);
        }

        .dept-header-banner {
            background: linear-gradient(135deg, #db2777 0%, #f472b6 100%);
            color: white;
            border-radius: 1.25rem;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm px-4 py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-custom-pink fs-4" href="patient-dashboard.html">
                <i class="bi bi-heart-pulse-fill me-2"></i>Somo, Cura
            </a>
            <a href="patient-dashboard.html#departments-section"
                class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                <i class="bi bi-arrow-right me-1"></i> العودة للوحة المريض
            </a>
        </div>
    </nav>

    <div class="container pb-5">
        <!-- ترويسة القسم -->
        <div
            class="dept-header-banner p-4 p-md-5 mb-4 shadow-sm d-flex flex-column flex-md-row align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="bg-white bg-opacity-25 rounded-circle p-3 fs-1 d-flex align-items-center justify-content-center"
                    style="width: 80px; height: 80px;" id="deptIcon">
                    <i class="bi bi-hospital"></i>
                </div>
                <div>
                    <h2 class="fw-bold mb-1" id="deptTitle">اسم القسم الطبي</h2>
                    <p class="mb-0 text-white-50" id="deptDoctor">الطبيب الاستشاري المشرف</p>
                </div>
            </div>
            <button id="bookDeptBtn" class="btn btn-light text-custom-pink fw-bold rounded-pill px-4 py-2 shadow-sm"
                data-bs-toggle="modal" data-bs-target="#bookDeptModal">
                <i class="bi bi-calendar-check me-1"></i> حجز موعد في القسم
            </button>
        </div>

        <div class="row g-4">
            <!-- العمود الأيمن: سجل القراءات وإضافة قراءة جديدة -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-4 mb-4 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold text-dark mb-0"><i
                                class="bi bi-journal-medical text-custom-pink me-2"></i>سجل القراءات والفحوصات</h5>
                        <button class="btn btn-custom-pink btn-sm rounded-pill px-3" data-bs-toggle="modal"
                            data-bs-target="#addReadingModal">
                            <i class="bi bi-plus-lg me-1"></i> إضافة قراءة جديدة
                        </button>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-light small text-muted">
                                <tr>
                                    <th>الفحص / القراءة</th>
                                    <th>النتيجة</th>
                                    <th>التاريخ</th>
                                    <th>الحالة</th>
                                </tr>
                            </thead>
                            <tbody id="deptTableBody">
                                <!-- تتعبأ ديناميكياً -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- العمود الأيسر: توصية الذكاء الاصطناعي -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 p-4 h-100 bg-white"
                    style="border-top: 4px solid #db2777 !important;">
                    <h5 class="fw-bold text-custom-pink mb-3"><i class="bi bi-cpu-fill me-2"></i>تحليل الذكاء الاصطناعي
                    </h5>
                    <p class="text-dark small lh-lg" id="deptAIAnalysis">جاري تحميل التحليل الذكي...</p>
                    <hr class="my-3 opacity-25">
                    <h6 class="fw-bold text-dark small mb-2">نصائح سريعة للقسم:</h6>
                    <ul class="small text-muted ps-3 mb-0" id="deptTips">
                        <!-- تتعبأ ديناميكياً -->
                    </ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal إضافة قراءة جديدة -->
    <div class="modal fade" id="addReadingModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4 p-3">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">تسجيل قراءة جديدة</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="newReadingForm">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">نوع الفحص / القراءة</label>
                            <input type="text" id="readingName" class="form-control"
                                placeholder="مثال: سكر صائم / ضغط الدم" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">القيمة / النتيجة</label>
                            <input type="text" id="readingValue" class="form-control" placeholder="مثال: 110 mg/dL"
                                required>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-custom-pink rounded-pill">حفظ القراءة في السجل</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal حجز موعد -->
    <div class="modal fade" id="bookDeptModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow rounded-4 p-3">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold">حجز موعد في القسم</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form
                        onsubmit="event.preventDefault(); alert('تم إرسال طلب حجز الموعد بنجاح!'); bootstrap.Modal.getInstance(document.getElementById('bookDeptModal')).hide();">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">اختر التاريخ المناسب</label>
                            <input type="date" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">الفترة الزمنية</label>
                            <select class="form-select">
                                <option>صباحاً (09:00 ص - 12:00 م)</option>
                                <option>مساءً (01:00 م - 05:00 م)</option>
                            </select>
                        </div>
                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-custom-pink rounded-pill">تأكيد الحجز</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const departments = {
            'heart_vascular': {
                canBook: true,
                title: 'قسم القلب والأوعية الدموية',
                doctor: 'إشراف: د. رامي الخالدي - استشاري أمراض القلب والشرايين',
                icon: '<i class="bi bi-heart-pulse"></i>',
                ai: 'بناءً على بيانات التوأم الرقمي، مؤشرات الدورة الدموية وضغط الشرايين لديك مستقرة جداً خلال آخر 14 يوماً.',
                tips: ['مارس المشي السريع 30 دقيقة يومياً.', 'قلل من الصوديوم والأطعمة المالحة.', 'قِس الضغط في نفس التوقيت يومياً.'],
                rows: [
                    { name: 'ضغط الدم الانقباضي/الانبساطي', val: '120/80 mmHg', date: '15/11/2026', status: 'طبيعي', badge: 'bg-success' },
                    { name: 'معدل نبض القلب أثناء الراحة', val: '72 bpm', date: '12/11/2026', status: 'ممتاز', badge: 'bg-success' }
                ]
            },
            'diabetes': {
                canBook: true,
                title: 'قسم الباطنية والسكري',
                doctor: 'إشراف: د. سارة المنصور - أخصائية الغدد الصماء والسكري',
                icon: '<i class="bi bi-capsule"></i>',
                ai: 'مستويات السكر الصائم والتراكمي ضمن النطاق الآمن. استمرارك على مواعيد الجرعات ساهم في استقرار المنحنى.',
                tips: ['اشرب كميات كافية من الماء.', 'تجنب المشروبات المحلاة والعصائر الصناعية.', 'التزم بموعد جرعة الدواء بعد الإفطار.'],
                rows: [
                    { name: 'فحص السكر الصائم', val: '104 mg/dL', date: '16/11/2026', status: 'طبيعي', badge: 'bg-success' },
                    { name: 'السكر التراكمي (HbA1c)', val: '6.3%', date: '01/11/2026', status: 'مسيطر عليه', badge: 'bg-primary' }
                ]
            },
            'labs': {
                canBook: false, // مخفي لأنها سجلات فحوصات
                title: 'قسم الفحوصات المخبرية',
                doctor: 'إشراف: مختبرات Somo, Cura المركزية',
                icon: '<i class="bi bi-activity"></i>',
                ai: 'تحليل نتائج المختبر الأخيرة يظهر توازناً ممتازاً في مكونات الدم والفيتامينات الأساسية دون مؤشرات التهاب.',
                tips: ['الصيام 8-12 ساعة قبل فحوصات الدهون والسكر.', 'احفظ نسخ التقارير الرقمية للمقارنة الدورية.'],
                rows: [
                    { name: 'صورة الدم الكاملة (CBC)', val: 'سليم', date: '10/11/2026', status: 'طبيعي', badge: 'bg-success' },
                    { name: 'فيتامين د (Vitamin D)', val: '36 ng/mL', date: '10/11/2026', status: 'مقبول', badge: 'bg-info' }
                ]
            },
            'prescriptions': {
                canBook: false, // مخفي لأنها أداة روشتات OCR
                title: 'قسم الروشتات والوصفات الطبية (OCR)',
                doctor: 'وحدة القراءة الذكية للوصفات وتنبيهات الجرعات',
                icon: '<i class="bi bi-file-medical"></i>',
                ai: 'تم مسح جميع الوصفات المرفوعة عبر تقنية OCR والتأكد من عدم وجود تعارض دوائي بين الأدوية المصروفة.',
                tips: ['تأكد من وضوح الإضاءة عند تصوير الروشتة.', 'لا توقف أي مضاد حيوي قبل إتمام المدة المحددة.'],
                rows: [
                    { name: 'روشتة #108 - Vitamin D3 5000', val: 'حبة واحدة بعد الغداء', date: '14/11/2026', status: 'مؤكد OCR', badge: 'bg-success' },
                    { name: 'روشتة #105 - Panadol Extra', val: 'عند اللزوم', date: '05/11/2026', status: 'مؤكد OCR', badge: 'bg-success' }
                ]
            },
            'general_heart': {
                canBook: true,
                title: 'قسم أمراض القلب العام',
                doctor: 'إشراف: د. رامي الخالدي',
                icon: '<i class="bi bi-heart-fill"></i>',
                ai: 'تخطيط القلب الأخير وفحص الإيكو يظهران كفاءة عالية لعضلة القلب وانتظاماً تاماً في النبض.',
                tips: ['تجنب الإجهاد البدني المفاجئ.', 'احرص على النوم 7-8 ساعات ليلاً.'],
                rows: [
                    { name: 'تخطيط القلب الكهربائي (ECG)', val: 'إيقاع منتظم', date: '02/11/2026', status: 'سليم', badge: 'bg-success' },
                    { name: 'كفاءة عضلة القلب (EF)', val: '65%', date: '02/11/2026', status: 'ممتاز', badge: 'bg-success' }
                ]
            },
            'blood_pressure': {
                canBook: false, // مخفي لأنها أداة متابعة يومية
                title: 'قسم ضغط الدم',
                doctor: 'إشراف: وحدة متابعة الضغط المزمن',
                icon: '<i class="bi bi-speedometer2"></i>',
                ai: 'متوسط قراءات الضغط الصباحية والمسائية مستقر جداً ولا يشير إلى أي ارتفاعات مفاجئة.',
                tips: ['ارتاح 5 دقائق قبل أخذ القراءة.', 'تجنب الكافيين قبل قياس الضغط بنصف ساعة.'],
                rows: [
                    { name: 'قياس الضغط الصباحي', val: '118/76 mmHg', date: '16/11/2026', status: 'مثالي', badge: 'bg-success' },
                    { name: 'قياس الضغط المسائي', val: '122/80 mmHg', date: '15/11/2026', status: 'طبيعي', badge: 'bg-success' }
                ]
            },
            'kidney': {
                canBook: true,
                title: 'قسم أمراض الكلى',
                doctor: 'إشراف: د. طارق العلي - أخصائي أمراض الكلى',
                icon: '<i class="bi bi-shield-plus"></i>',
                ai: 'معدلات الكرياتينين واليوريا في الدم ضمن الحدود الطبيعية، مما يعكس كفاءة ممتازة في وظائف الترشيح الكلوي.',
                tips: ['اشرب 8 أكواب من الماء يومياً على الأقل.', 'تجنب الإفراط في المسكنات دون استشارة الطبيب.'],
                rows: [
                    { name: 'فحص الكرياتينين (Creatinine)', val: '0.88 mg/dL', date: '08/11/2026', status: 'طبيعي', badge: 'bg-success' },
                    { name: 'فحص اليوريا (BUN)', val: '15 mg/dL', date: '08/11/2026', status: 'طبيعي', badge: 'bg-success' }
                ]
            },
            'liver': {
                canBook: true,
                title: 'قسم الكبد والمرارة',
                doctor: 'إشراف: د. محمود حداد - أخصائي الجهاز الهضمي والكبد',
                icon: '<i class="bi bi-clipboard2-pulse"></i>',
                ai: 'إنزيمات الكبد طبيعية تماماً وصورة السونار تؤكد سلامة المرارة وخلوها من أي التهابات أو حصوات.',
                tips: ['قلل من الدهون المشبعة والأطعمة المقلية.', 'أكثر من الخضروات الورقية والألياف.'],
                rows: [
                    { name: 'إنزيمات الكبد (ALT / AST)', val: '24 / 22 U/L', date: '04/11/2026', status: 'طبيعي', badge: 'bg-success' },
                    { name: 'سونار البطن والمرارة', val: 'لا توجد حصوات', date: '04/11/2026', status: 'سليم', badge: 'bg-success' }
                ]
            }
        };

        const urlParams = new URLSearchParams(window.location.search);
        const deptType = urlParams.get('type') || 'heart_vascular';
        const currentDept = departments[deptType] || departments['heart_vascular'];

        // التحكم بإظهار أو إخفاء زر حجز الموعد
        const bookBtn = document.getElementById('bookDeptBtn');
        if (currentDept.canBook === false) {
            bookBtn.style.display = 'none';
        } else {
            bookBtn.style.display = 'inline-block';
        }

        document.getElementById('deptTitle').innerText = currentDept.title;
        document.getElementById('deptDoctor').innerText = currentDept.doctor;
        document.getElementById('deptIcon').innerHTML = currentDept.icon;
        document.getElementById('deptAIAnalysis').innerText = currentDept.ai;

        const tipsList = document.getElementById('deptTips');
        currentDept.tips.forEach(tip => {
            tipsList.innerHTML += `<li class="mb-1">${tip}</li>`;
        });

        const tbody = document.getElementById('deptTableBody');
        currentDept.rows.forEach(r => {
            tbody.innerHTML += `
            <tr>
                <td class="fw-semibold">${r.name}</td>
                <td>${r.val}</td>
                <td class="text-muted small">${r.date}</td>
                <td><span class="badge ${r.badge} bg-opacity-10 text-dark px-2 py-1">${r.status}</span></td>
            </tr>
        `;
        });

        document.getElementById('newReadingForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('readingName').value;
            const val = document.getElementById('readingValue').value;
            const today = new Date().toLocaleDateString('en-GB');

            tbody.insertAdjacentHTML('afterbegin', `
            <tr>
                <td class="fw-semibold">${name}</td>
                <td>${val}</td>
                <td class="text-muted small">${today}</td>
                <td><span class="badge bg-danger bg-opacity-10 text-custom-pink px-2 py-1">مضاف حديثاً</span></td>
            </tr>
        `);

            this.reset();
            bootstrap.Modal.getInstance(document.getElementById('addReadingModal')).hide();
        });
    </script>
</body>

</html>
